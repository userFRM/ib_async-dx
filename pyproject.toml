[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ib_async-dx"
version = "0.1.0"
description = "ib_async without the gateway: the ib_async API on the ibkr-dx engine."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["ibkr-dx>=0.1,<0.2", "ib_async>=2.1,<2.2", "aeventkit>=2.1,<3"]

[project.urls]
Homepage = "https://github.com/userFRM/ib_async-dx"
Documentation = "https://userfrm.github.io/ib_async-dx/"
Repository = "https://github.com/userFRM/ib_async-dx"
Issues = "https://github.com/userFRM/ib_async-dx/issues"

[tool.hatch.build.targets.wheel]
packages = ["python/ib_async_dx"]

# The Rust crate beside the package ships through cargo, not in this sdist.
[tool.hatch.build.targets.sdist]
exclude = ["/Cargo.toml", "/Cargo.lock", "/src", "/examples", "/tests/*.rs", "/tests/oracle"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
