name: docs

# The book is built on every pull request that touches it, so a change that
# breaks it is seen before it lands, and published only from `main`.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To ask whether there is a Pages site; publishing is the deploy job's.
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      # The theme styles mdBook 0.5's page, and GitHub-style alerts render from
      # 0.5 on. Pinned to the version the book is built and checked with.
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.2/mdbook-v0.5.2-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A warning is a broken book: a link to a page that is not there, or a
      # page the summary does not reach. `shell: bash` runs the step with
      # pipefail, so a build that fails without saying WARN or ERROR fails it
      # too.
      - name: Build book
        shell: bash
        run: |
          mdbook build docs/book 2>&1 | tee "$RUNNER_TEMP/mdbook.log"
          if grep -E "WARN|ERROR" "$RUNNER_TEMP/mdbook.log"; then exit 1; fi

      # Publishing needs Pages turned on for the repository. Only a 404 says it
      # is not, and then the book is built and not published. Any other answer
      # — a token that cannot read the setting, the API down — fails the run,
      # rather than pass with nothing published.
      - name: Is there a Pages site to publish to
        id: pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if answer=$(gh api "repos/${{ github.repository }}/pages" 2>&1); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" <<<"$answer"; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages is not enabled for ${{ github.repository }}; the book built and is not being published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$answer" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: docs/book/book

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
